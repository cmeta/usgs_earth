name: Download and Release USGS Data

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      skip_download:
        description: 'Skip download step (just test release)'
        required: false
        type: boolean
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  URLS: |
    https://dds.cr.usgs.gov/download-staging/eyJpZCI6OTc3NTc2NTM1LCJjb250YWN0SWQiOjI2MjM2MjEyfQ==

jobs:
  download:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.skip_download != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download files
        run: |
          mkdir -p downloads

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Downloading: $url"

            filename=$(echo "$url" | md5sum | cut -d' ' -f1)
            filename="usgs_data_${filename}.zip"

            curl -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.5" \
              -H "Accept-Encoding: gzip, deflate, br" \
              -H "Connection: keep-alive" \
              -H "Upgrade-Insecure-Requests: 1" \
              -H "Sec-Fetch-Dest: document" \
              -H "Sec-Fetch-Mode: navigate" \
              -H "Sec-Fetch-Site: none" \
              -H "Sec-Fetch-User: ?1" \
              -H "Cache-Control: max-age=0" \
              --keepalive-time 60 \
              --connect-timeout 30 \
              --max-time 3600 \
              --limit-rate 2M \
              -o "downloads/$filename" \
              "$url"

            echo "Downloaded: $filename ($(du -sh downloads/$filename | cut -f1))"
          done <<< "${{ env.URLS }}"

      - name: List downloads
        run: |
          echo "=== Downloaded files ==="
          ls -lh downloads/

      - name: Create release archive
        run: |
          cd downloads
          zip -r ../usgs_data.zip .
          cd ..

          echo "=== Archive contents ==="
          unzip -l usgs_data.zip | head -20

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: usgs_data.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
