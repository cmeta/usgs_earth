name: Download and Release USGS Data

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      skip_download:
        description: 'Skip download step (just test release)'
        required: false
        type: boolean
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  URLS: |
    https://dds.cr.usgs.gov/download-staging/eyJpZCI6OTc3NTc2NTM1LCJjb250YWN0SWQiOjI2MjM2MjEyfQ==

jobs:
  download:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.skip_download != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2

      - name: Download files
        run: |
          mkdir -p downloads

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Downloading: $url"

            filename=$(echo "$url" | md5sum | cut -d' ' -f1)
            filename="usgs_data_${filename}.zip"

            aria2c "$url" \
              --out="downloads/$filename" \
              --split=4 \
              --max-connection-per-server=4 \
              --max-download-limit=2M \
              --connect-timeout=30 \
              --timeout=3600 \
              --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

            echo "Downloaded: $filename ($(du -sh downloads/$filename | cut -f1))"
          done <<< "${{ env.URLS }}"

      - name: List downloads
        run: |
          echo "=== Downloaded files ==="
          ls -lh downloads/

      - name: Create release archive
        run: |
          cd downloads
          zip -r ../usgs_data.zip .
          cd ..

          echo "=== Archive contents ==="
          unzip -l usgs_data.zip | head -20

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: usgs_data.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
