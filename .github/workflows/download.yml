name: Download USGS Data

on:
  workflow_dispatch:
    inputs:
      usgs_url:
        description: 'USGS download URL'
        required: true
        type: string
      download_name:
        description: 'Name for this download (for artifact naming)'
        required: false
        type: string
        default: 'usgs_data'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2

      - name: Download USGS data
        run: |
          echo "Downloading: ${{ inputs.usgs_url }}"
          echo "Using aria2 with single connection to avoid rate limit"

          aria2c "${{ inputs.usgs_url }}" \
            --out="${{ inputs.download_name }}.zip" \
            --connect-timeout=30 \
            --timeout=3600 \
            --max-limit=2M \
            --max-concurrent-downloads=4 \
            --split=4 \
            --enable-split=true \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

      - name: Check downloaded file
        run: |
          ls -lh "${{ inputs.download_name }}.zip" 2>/dev/null || echo "File not found"
          file "${{ inputs.download_name }}.zip" 2>/dev/null || echo "Unknown file type"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.download_name }}
          path: ${{ inputs.download_name }}.zip
          retention-days: 5
