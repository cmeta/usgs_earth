name: Download USGS Data

on:
  workflow_dispatch:
    inputs:
      usgs_url:
        description: 'USGS download URL'
        required: true
        type: string
      download_name:
        description: 'Name for this download (for artifact naming)'
        required: false
        type: string
        default: 'usgs_data'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download USGS data
        run: |
          echo "Downloading: ${{ inputs.usgs_url }}"
          echo "Rate limit: limiting to 1 connection to avoid USGS IP rate-limit"

          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o "${{ inputs.download_name }}.zip" \
            "${{ inputs.usgs_url }}" \
            --progress-bar \
            --connect-timeout 30 \
            --max-time 3600 \
            --max-redirs 5 \
            --limit-rate 1M

      - name: Check downloaded file
        run: |
          ls -lh "${{ inputs.download_name }}.zip" 2>/dev/null || echo "File not found"
          file "${{ inputs.download_name }}.zip" 2>/dev/null || echo "Unknown file type"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.download_name }}
          path: ${{ inputs.download_name }}.zip
          retention-days: 5